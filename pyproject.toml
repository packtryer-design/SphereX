[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-package"
version = "0.1.0"
description = "Short description of the project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME", email = "you@example.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy",
    "astropy",
    "astroquery",
    "reproject",
    "scipy",  # psf.py (map_coordinates); was only arriving via reproject
    "pillow",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
]

[project.urls]
Homepage = "https://github.com/OWNER/REPO"
Issues = "https://github.com/OWNER/REPO/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/my_package"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --cov=my_package --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # exploratory, not production code
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

# Hackathon speed: api/ and untyped astro libraries are not strict-checked.
[[tool.mypy.overrides]]
module = ["api.*", "astropy.*", "astroquery.*", "reproject.*"]
ignore_errors = true
ignore_missing_imports = true

# shortcut: tests for the (unchecked) api/science code are unchecked too; annotate after the hackathon
[[tool.mypy.overrides]]
module = ["test_features", "test_science", "test_science_v2"]
ignore_errors = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
