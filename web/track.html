<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blink · Track Pluto</title>
  <meta name="description" content="Follow Pluto, the original Planet X, through NASA SPHEREx images.">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="style.css">
  <style>
    .track { max-width: 760px; margin: 0 auto; padding: 16px; }
    .track h1 { font-size: 1.5rem; margin: 8px 0 4px; }
    .track p { color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
    .sky { position: relative; aspect-ratio: 1; background: #000; border-radius: var(--radius); overflow: hidden; }
    .sky img { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    .ring { position: absolute; width: 9%; aspect-ratio: 1; border: 2px solid var(--b);
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    .ring[hidden] { display: none; }
    .stamp { position: absolute; left: 12px; bottom: 10px; text-shadow: 0 1px 3px #000; }
    .stamp strong { font-size: 1.15rem; display: block; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .controls input[type=range] { flex: 1; min-width: 160px; }
    .controls button { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
                       background: var(--surface-2); color: var(--text); cursor: pointer; }
    .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .note { font-size: .9rem; color: var(--muted); margin-top: 12px; }
  </style>
</head>
<body>
  <main class="track">
    <a href="./">← Blink</a>
    <h1>Pluto, the original Planet X</h1>
    <p>In 1930 Clyde Tombaugh found Pluto by blinking two photographs: stars stay put, Pluto
      moves. Here are NASA SPHEREx's own images of Pluto over three days. The ring is where
      NASA JPL's orbit predicts it, worked out independently of these images.</p>

    <div class="sky">
      <img id="frame" alt="SPHEREx infrared image of the sky around Pluto">
      <div id="ring" class="ring" aria-hidden="true"></div>
      <div class="stamp" aria-live="polite"><strong id="when">Loading…</strong><span id="what"></span></div>
    </div>

    <div class="controls">
      <button id="play" type="button">Pause</button>
      <input id="scrub" type="range" min="0" value="0" aria-label="Frame">
      <label><input id="show-ring" type="checkbox" checked> Show predicted position</label>
    </div>
    <p class="note" id="note"></p>
  </main>

  <script type="module">
    const q = new URLSearchParams(location.search);
    const api = (q.get("api") ?? "") + "/api/track?" + new URLSearchParams({
      body: q.get("body") ?? "pluto", mjd: q.get("mjd") ?? "60956", days: q.get("days") ?? "2",
    });
    const $ = (id) => document.getElementById(id);
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const r = await fetch(api).then((x) => x.ok ? x.json() : Promise.reject(x.statusText))
      .catch((e) => { $("when").textContent = "Couldn't load the images: " + e; throw e; });
    const f = r.frames, n = r.target.size_px, t0 = f[0].mjd;
    f.forEach((x) => { new Image().src = x.png; });  // preload so playback doesn't stutter
    $("scrub").max = f.length - 1;
    $("note").textContent = `${f.length} SPHEREx exposures over ${((f.at(-1).mjd - t0) * 24).toFixed(0)} hours, ` +
      `aligned so the stars stay still. ${r.source}`;

    function show(i) {
      const x = f[i], p = x.predicted;
      $("frame").src = x.png;
      $("scrub").value = i;
      $("ring").style.left = `${((p.x + 0.5) / n) * 100}%`;
      $("ring").style.top = `${((n - 1 - p.y + 0.5) / n) * 100}%`;  // image rows run top-down
      $("when").textContent = `+${((x.mjd - t0) * 24).toFixed(0)} hours`;
      $("what").textContent = `${x.wavelength_um?.toFixed(2) ?? "?"} µm infrared · detector ${x.detector}`;
    }

    let i = 0, timer = null;
    const play = () => { timer = setInterval(() => show(i = (i + 1) % f.length), 350); $("play").textContent = "Pause"; };
    const pause = () => { clearInterval(timer); timer = null; $("play").textContent = "Play"; };
    $("play").onclick = () => (timer ? pause() : play());
    $("scrub").oninput = (e) => { pause(); show(i = +e.target.value); };
    $("show-ring").onchange = (e) => { $("ring").hidden = !e.target.checked; };
    show(0);
    reduced ? pause() : play();
  </script>
</body>
</html>
